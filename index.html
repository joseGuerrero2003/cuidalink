<title>CuidaLink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Una columna de 560px. Paleta y tipografía del prototipo: fondo crema, verde azulado profundo, titulares serif. */
:root{
  --bg:#FAF6EA; --surface:#FFFEF9; --surface-2:#F1EBD9; --fg:#12292B; --muted:#546566; --line:#E6DEC6;
  --brand:#005A62; --brand-line:#005A62; --on-brand:#FFFFFF; --brand-soft:#D8EAEA;
  --hero-bg:#005A62; --hero-fg:#FFFFFF; --hero-card:rgba(255,255,255,.12); --hero-line:rgba(255,255,255,.38);
  --accent:#F0B24A; --on-accent:#2B1E00;
  --ok:#1B7A4B; --ok-bg:#DCF0E4; --warn:#7A4E00; --warn-bg:#FBEACB; --bad:#9C2227; --bad-bg:#FADFDF;
  --focus:#0B5FFF; --shadow:0 2px 14px rgba(18,41,43,.08);
  --f-display:'Fraunces',Georgia,serif; --f-body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1E; --surface:#152729; --surface-2:#1D3437; --fg:#E9F2F1; --muted:#A5BCBD; --line:#2A4549;
    --brand-line:#6FB3BE; --brand-soft:#1D3A3E;
    --ok:#7FD6AB; --ok-bg:#173A2B; --warn:#F3C676; --warn-bg:#3A2E10; --bad:#FF9EA1; --bad-bg:#3E1A1C;
    --focus:#8DB4FF; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1E; --surface:#152729; --surface-2:#1D3437; --fg:#E9F2F1; --muted:#A5BCBD; --line:#2A4549;
  --brand-line:#6FB3BE; --brand-soft:#1D3A3E;
  --ok:#7FD6AB; --ok-bg:#173A2B; --warn:#F3C676; --warn-bg:#3A2E10; --bad:#FF9EA1; --bad-bg:#3E1A1C;
  --focus:#8DB4FF; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0}
body[data-screen="landing"]{background:var(--hero-bg);color:var(--hero-fg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
.wrap.has-nav{padding-bottom:110px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* Entrada */
.landing{max-width:560px;margin:0 auto;padding-block:40px 32px;display:flex;flex-direction:column;gap:28px;min-height:100svh}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;font-size:20px}
.landing h1{font-size:clamp(34px,9vw,46px)}
.landing .lead{font-size:20px;opacity:.95}
.roles{display:flex;flex-direction:column;gap:14px}
.role{display:flex;gap:16px;align-items:center;text-align:left;text-decoration:none;color:var(--hero-fg);background:var(--hero-card);border:2px solid var(--hero-line);border-radius:20px;padding:18px 20px;min-height:96px}
.role:hover{background:rgba(255,255,255,.2)}
.role svg{flex:none;width:44px;height:44px}
.role b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700}
.role span{display:block;font-size:17px;opacity:.92;line-height:1.35}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:15px;opacity:.95}
.chip-conn{display:inline-flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#9FB8BB;display:inline-block}
.dot.live{background:#35C27A}.dot.off{background:#E5484D}
.linkbtn{background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer;color:inherit;font-size:16px;text-align:left;min-height:44px}

/* Estructura interna */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--brand-line);font-weight:700;min-height:44px}
.pill-role{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--brand);color:var(--on-brand);padding:6px 12px;border-radius:999px}
.pill-role .dot{width:8px;height:8px}
h1.page{font-size:34px}
h2{font-size:26px}
h3{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:15px}
.big{font-size:23px;font-family:var(--f-display);font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:700}
.alert{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.state{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.state.ok{background:var(--ok-bg);color:var(--ok)}
.state.warn{background:var(--warn-bg);color:var(--warn)}
.state b{font-size:20px}

label,.lbl{font-weight:800;display:block;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;min-height:52px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:96px;resize:vertical}
input[data-pin]{letter-spacing:.4em;font-size:22px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.err{color:var(--bad);font-weight:800}
.err:empty{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:16px;border:2px solid var(--brand-line);background:var(--brand);color:var(--on-brand);font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:8px 16px}
.btn.huge{min-height:128px;font-size:28px;font-family:var(--f-display);border-radius:26px;flex-direction:column}
.huge svg{width:46px;height:46px}

/* Pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 9px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:800;min-height:64px;position:relative}
.tab svg{width:28px;height:28px}
.tab[aria-current=page]{color:var(--brand-line)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand-line)}
.badge[hidden]{display:none}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Avatares y chips */
.av{flex:none;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.av.lg{width:56px;height:56px;font-size:20px}
.chipst{font-size:14px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.chipst.soon{background:var(--warn-bg);color:var(--warn)}
.chipst.live{background:var(--accent);color:var(--on-accent)}
.chipst.late{background:var(--bad-bg);color:var(--bad)}
.chipst.completada{background:var(--ok-bg);color:var(--ok)}
.chipst.cancelada{background:var(--surface-2);color:var(--muted)}
.chipst.nuevo{background:var(--brand);color:var(--on-brand)}
.chipst.demo{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.ver{display:inline-flex;gap:4px;align-items:center;color:var(--ok);font-weight:800;font-size:14px}
.ver svg{width:16px;height:16px}

/* Siguiente visita */
.hero{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px}
.hero .k{font-size:15px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.hero .t{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.1}
.hero .w{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.12);border-radius:16px;padding:12px}
.hero a{color:inherit;font-weight:800}

/* Tarjetas de visita */
.dayh{font-family:var(--f-display);font-weight:600;font-size:19px;margin-top:6px}
.dayh small{font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:15px;margin-left:6px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:14px;box-shadow:var(--shadow)}
.visit.nuevo{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.visit.cancelada{opacity:.75}
.vdate{flex:none;width:62px;border-radius:14px;background:var(--brand-soft);color:var(--brand-line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;line-height:1.05;font-weight:800;text-transform:uppercase;font-size:13px;align-self:flex-start}
.vdate b{font-family:var(--f-display);font-size:28px}
.vbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.vhora{font-family:var(--f-display);font-size:20px;font-weight:600}
.vwho{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:8px 10px}
.vwho .av{width:38px;height:38px;font-size:14px}
.vwho b{display:block;line-height:1.2}
.empty{border:2px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);text-align:center}
.confirm{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Asistente de agendar */
.steps{display:flex;gap:8px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--brand)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.svc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:76px;cursor:pointer}
.svc[aria-checked=true],.comp[aria-checked=true]{border-color:var(--brand-line);background:var(--brand-soft)}
.svc svg{flex:none;width:34px;height:34px;color:var(--brand-line)}
.svc b{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pickchip{min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer}
.pickchip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:2px solid var(--brand-line);background:var(--surface);font-size:26px;font-weight:800;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper output{font-family:var(--f-display);font-size:24px;font-weight:600;min-width:110px;text-align:center}
.comp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;min-height:76px}
.comp:disabled{opacity:.55;cursor:not-allowed}
.comp .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.comp .km{font-weight:800;white-space:nowrap;text-align:right;font-size:15px}
.tag{font-size:13px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-left:8px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface-2);border-radius:16px;padding:14px 16px}
.total b{font-family:var(--f-display);font-size:28px}
.summary{background:var(--brand-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}

/* Pagos (como el prototipo) */
.earn{background:var(--brand);color:var(--on-brand);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:6px}
.earn .k{font-size:19px;opacity:.9;font-weight:600}
.earn .n{font-size:clamp(40px,11vw,52px);font-weight:800;line-height:1.1}
.earn .s{font-size:17px;opacity:.92}
.paylist{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.pay{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;align-items:center}
.pay+.pay{border-top:1px solid var(--line)}
.pay b.d{display:block;font-size:19px}
.pay .amt{text-align:right}
.pay .amt b{display:block;color:var(--ok);font-size:19px;font-weight:800;white-space:nowrap}
.pay .amt{flex:none}
.pay .amt small{color:var(--muted);font-size:15px}
.monthh{display:flex;justify-content:space-between;padding:12px 20px;background:var(--surface-2);font-weight:800;font-size:15px;color:var(--muted)}
.nextpay{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--brand-line);border-radius:18px;padding:12px 16px}

.toast{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:14px 20px;border-radius:16px;font-weight:800;max-width:calc(100vw - 32px);z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
body[data-screen="landing"] .toast,body[data-screen="adulto"] .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.visit{padding:12px;gap:10px}.vdate{width:54px}}
@media (prefers-reduced-motion:no-preference){
  .role,.btn,.svc,.comp,.pickchip{transition:background .15s,filter .15s,border-color .15s}
  .visit.nuevo{animation:pop .6s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
}
</style>

function fechaPago(f){var d=new Date(f+'T12:00:00');return cap(d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}).replace(',',''));}
function diasHasta(f){return Math.round((new Date(f+'T00:00:00').getTime()-new Date(localDate()+'T00:00:00').getTime())/864e5);}
function etiquetaDia(f){var n=diasHasta(f);return n===0?'Hoy':n===1?'Mañana':n===-1?'Ayer':fechaLarga(f);}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});}
function hace(iso){
  var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return 'hace un momento';
  if(m<60)return 'hace '+m+' min';
  var h=Math.floor(m/60);
  if(h<24)return 'hace '+h+(h===1?' hora':' horas');
  var d=Math.floor(h/24);
  return 'hace '+d+(d===1?' día':' días');
}
function faltan(v){
  if(v.estado==='en_curso')return {t:'En curso',c:'live'};
  var ms=startMs(v)-Date.now();
  if(ms<=0)return Date.now()<endMs(v)?{t:'Ya es la hora',c:'live'}:{t:'Sin iniciar',c:'late'};
  var m=Math.ceil(ms/60000);
  if(m<60)return {t:'Faltan '+m+' min',c:'soon'};
  var h=Math.floor(m/60),mm=m%60;
  if(h<24)return {t:'Faltan '+h+' h'+(mm?' '+mm+' min':''),c:h<3?'soon':''};
  var d=Math.floor(h/24),hh=h%24;
  return {t:'Faltan '+d+(d===1?' día':' días')+(hh&&d<3?' '+hh+' h':''),c:''};
}
function haversine(a,b){
  var R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)*Math.sin(dg/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function kmTxt(d){return d<0.3?'En el mismo barrio':d<1?'a '+(Math.max(1,Math.round(d*10))*100)+' m':'a '+d.toFixed(1).replace('.',',')+' km';}
function distancia(barrioA,barrioB){
  var a=BARRIOS[barrioA],b=BARRIOS[barrioB];
  if(!a||!b)return null;
  return haversine(a,b);
}

function usarUbicacion(btn){
  if(!navigator.geolocation){toast('Tu navegador no permite usar la ubicación. Elige el barrio en la lista.','bad');return;}
  btn.disabled=true;
  navigator.geolocation.getCurrentPosition(function(p){
    var best=null,bd=1e9,pt=[p.coords.latitude,p.coords.longitude];
    Object.keys(BARRIOS).forEach(function(k){var d=haversine(pt,BARRIOS[k]);if(d<bd){bd=d;best=k;}});
    btn.disabled=false;
    if(best&&bd<25){ui.barrioSel=best;var s=$('#barrio');if(s)s.value=best;toast('Barrio más cercano: '+best+'. Puedes cambiarlo.');}
    else toast('Parece que estás fuera de Cali. Elige el barrio en la lista.','bad');
  },function(){btn.disabled=false;toast('No pudimos usar tu ubicación. Elige el barrio en la lista.','bad');},{timeout:8000,maximumAge:600000});
}

    var v=currentView();if(v)v.mount();
  }
  if(!ui.scrollTo)window.scrollTo(0,0);
  update();
}

/* ===== Acciones ===== */
function needDb(){
  if(!state.db){toast('Sin conexión con la base de datos. Intenta de nuevo en unos segundos.','bad');return false;}
  return true;
}
function run(btn,fn,okMsg){
  if(!needDb())return Promise.resolve();
  if(btn)btn.disabled=true;
  return Promise.resolve().then(fn).then(function(r){if(okMsg)toast(okMsg);return r;}).catch(function(e){
    console.error(e);
    toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de datos de demostración. Usa “Reiniciar datos”.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.','bad');
  }).then(function(r){if(btn)btn.disabled=false;return r;});
}
function seedVisitas(){
  return Promise.all(DEMO_VISITAS.map(function(v){
    var o=Object.assign({},v,{barrio:'Ciudad Jardín',estado:'completada',demo:true});delete o.id;
    return state.db.doc('visitas/'+v.id).set(o);
  }));
}

function nuevoCodigo(){
  var code=randPin();
  return state.db.doc('codigos/'+code).get().then(function(sn){return sn.exists?nuevoCodigo():code;});
}
function pairCheck(code){
  var lk=parseInt(ls('cuidalink_pairlock')||'0',10);
  if(lk>Date.now())return Promise.resolve({ok:false,tipo:'bloqueado',min:Math.ceil((lk-Date.now())/60000)});
  return state.db.doc('codigos/'+code).get().then(function(sn){
    if(sn.exists){ls('cuidalink_pairtry','0');return {ok:true,hid:sn.data().hid};}
    var n=parseInt(ls('cuidalink_pairtry')||'0',10)+1;
    if(n>=MAXINT){ls('cuidalink_pairtry','0');ls('cuidalink_pairlock',String(Date.now()+BLOQUEO_MS));return {ok:false,tipo:'bloqueado',min:5};}
    ls('cuidalink_pairtry',String(n));return {ok:false,tipo:'mal',quedan:MAXINT-n};
  });
}
function generarCodigo(btn){
  var code=randPin();
  var nc=null;run(btn,function(){var h=famHid();return nuevoCodigo().then(function(c0){nc=c0;return state.db.collection('codigos').where('hid','==',h).get();}).then(function(s){return Promise.all(s.docs.map(function(d){return state.db.doc('codigos/'+d.id).delete();}));}).then(function(){return state.db.doc('codigos/'+nc).set({hid:h,creada:nowISO()});}).then(function(){return true;});},null).then(function(ok){if(!ok)return;var code=nc;
    ui.codigoHogar=code;audit('hogar_nuevo','');update();
  });
}
function loginAcomp(btn){
  var code=($('#lg-code').value||'').trim().toUpperCase(),pin=($('#lg-pin').value||'').trim(),err=$('#e-login');
  if(!code||!/^\d{6}$/.test(pin)){err.textContent='Escribe tu código y tu PIN de 6 dígitos.';return;}
  if(!needDb())return;
  err.textContent='';btn.disabled=true;
  state.db.collection('acompanantes').where('codigo','==',code).get().then(function(sn){
    if(sn.empty)return delay(700).then(function(){return {ok:false,tipo:'mal'};});
    var id=sn.docs[0].id;
    return verifyCred(id,pin).then(function(r){r.id=id;return r;});
  }).then(function(r){
    btn.disabled=false;
    if(r.ok){audit('acomp_login',r.id);startSession('acompanante',r.id);go('acompanante/agenda');}
    else{audit('acomp_fail',code.slice(0,12));err.textContent=msgAuth(r);var f=$('#lg-pin');if(f)f.value='';}
  }).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo verificar. Revisa tu conexión.';});
}
function loginFam(btn){
  var pin=($('#lg-pin').value||'').trim(),err=$('#e-login');
  if(!/^\d{6}$/.test(pin)){err.textContent='El PIN tiene 6 dígitos.';return;}
  if(!needDb())return;
  err.textContent='';btn.disabled=true;
  verifyCred('f_'+famHid(),pin).then(function(r){
    btn.disabled=false;
    if(r.ok){audit('fam_login','');startSession('familiar');go('familiar/inicio');}
    else{audit('fam_fail','');err.textContent=msgAuth(r).replace('Código o PIN','PIN');var f=$('#lg-pin');if(f)f.value='';}
  }).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo verificar. Revisa tu conexión.';});
}
function setupFam(btn){
  var a=($('#sf-1').value||'').trim(),b=($('#sf-2').value||'').trim(),err=$('#e-login');
  if(!/^\d{6}$/.test(a)){err.textContent='El PIN debe tener exactamente 6 números.';return;}
  if(pinDebil(a)){err.textContent='Ese PIN es fácil de adivinar. Evita repetidos y secuencias.';return;}
  if(a!==b){err.textContent='Los dos PIN no coinciden.';return;}
  if(!needDb())return;
  err.textContent='';btn.disabled=true;
  var code=randPin();
  var h=randHex(8);Promise.all([makeCred(a),nuevoCodigo()]).then(function(cs){code=cs[1];
    return Promise.all([state.db.doc('credenciales/f_'+h).set(cs[0]),state.db.doc('codigos/'+code).set({hid:h,creada:nowISO()})]);
  }).then(function(){
    btn.disabled=false;ls('cuidalink_fam',h);ui.codigoHogar=code;audit('fam_login','PIN creado');startSession('familiar');go('familiar/inicio');
  }).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo guardar. Revisa tu conexión.';});
}
function pairAdulto(btn){
  /* el vínculo se resuelve con pairCheck (código de 6 números → hogar) */
  var code=($('#pr-code').value||'').trim(),err=$('#e-login');
  if(!/^\d{6}$/.test(code)){err.textContent='El código tiene 6 números.';return;}
  if(!needDb())return;
  err.textContent='';btn.disabled=true;
  pairCheck(code).then(function(r){
    btn.disabled=false;
    if(r.ok){ls('cuidalink_adulto',JSON.stringify({hid:r.hid,code:code}));audit('pareado','');state.pair='ok';render();}
    else if(r.tipo==='sin'){err.textContent='Tu familiar aún no prepara la vinculación. Pídele que entre como familiar.';}
    else{audit('pareo_fail','');err.textContent=msgAuth(r).replace('Código o PIN incorrectos','Código incorrecto');var f=$('#pr-code');if(f)f.value='';}
  }).catch(function(e){console.error(e);btn.disabled=false;err.textContent='No se pudo verificar. Revisa tu conexión.';});
}
function borrarTodo(btn){
  run(btn,function(){
    var h=famHid();return Promise.all(['visitas','ayuda','checkins','auditoria','codigos'].map(function(c){
      return state.db.collection(c).where('hid','==',h).get().then(function(s){return Promise.all(s.docs.map(function(d){return state.db.doc(c+'/'+d.id).delete();}));});
    })).then(function(){return Promise.all([state.db.doc('perfil/'+h).delete(),state.db.doc('credenciales/f_'+h).delete()]);}).then(function(){return true;});
  },null).then(function(ok){ui.resetAsk=false;if(!ok){update();return;}ls('cuidalink_fam',null);logout('Listo: esta familia quedó en blanco.');});
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  if(el.type==='submit')return;
  switch(act){
    case 'cancelar': ui.cancelId=id;update();break;
    case 'cancelar-no': ui.cancelId=null;update();break;
    case 'cancelar-si': ui.cancelId=null;run(el,function(){return state.db.doc('visitas/'+id).update({estado:'cancelada'});},'Visita cancelada.').then(function(){audit('visita_cancelada','');});break;
    case 'llegue': run(el,function(){return state.db.doc('visitas/'+id).update({estado:'en_curso',llegada:nowISO()});},'Llegada registrada.').then(function(){audit('llegada',session?session.id:'');});break;
    case 'termine': run(el,function(){return state.db.doc('visitas/'+id).update({estado:'completada',salida:nowISO(),nota:(drafts[id]||'').trim().slice(0,500)});},'Visita completada. Ya aparece en Mis pagos.').then(function(){delete drafts[id];audit('salida',session?session.id:'');});break;
    case 'bien': run(el,function(){return state.db.collection('checkins').add({hid:hid(),creada:nowISO()});},null).then(function(){ui.msgAdulto='Listo. Tu familia ya sabe que estás bien.';update();});break;
    case 'ayuda-pedir': ui.confirmAyuda=true;ui.msgAdulto='';update();break;
    case 'ayuda-no': ui.confirmAyuda=false;update();break;
    case 'ayuda-si': run(el,function(){return state.db.collection('ayuda').add({hid:hid(),estado:'abierta',creada:nowISO()});},null).then(function(){ui.confirmAyuda=false;ui.msgAdulto='Avisamos a tu familia. Pronto se comunicarán contigo.';update();});break;
    case 'atender': run(el,function(){return state.db.doc('ayuda/'+id).update({estado:'atendida',atendida:nowISO()});},'Marcada como atendida.');break;
    case 'perfil-edit': ui.editPerfil=true;update();break;
    case 'perfil-cancel': ui.editPerfil=false;ui.barrioSel='';update();break;
    case 'geo': usarUbicacion(el);break;
    case 'logout': logout('Sesión cerrada.');break;
    case 'gen-codigo': generarCodigo(el);break;
    case 'codigo-ok': ui.codigoHogar=null;update();break;
    case 'desvincular': ls('cuidalink_adulto',null);state.pair='none';render();break;
    case 'wz-tipo': wz.tipo=v;ui.wizErr='';renderWiz();break;
    case 'wz-fecha': wz.fecha=v;ui.wizErr='';renderWiz();break;
    case 'wz-hora': wz.hora=v;ui.wizErr='';renderWiz();break;
    case 'wz-menos': wz.horas=Math.max(1,wz.horas-1);renderWiz();break;
    case 'wz-mas': wz.horas=Math.min(12,wz.horas+1);renderWiz();break;
    case 'wz-acomp': wz.acomp=v;renderWiz();break;
    case 'wz-mas-acomps': ui.masAcomps=true;renderWiz();break;
    case 'wz-next': wzNext();break;
    case 'wz-back': wz.step=Math.max(1,wz.step-1);ui.wizErr='';renderWiz();break;
    case 'wz-confirmar': confirmarVisita(el);break;
    case 'reset-ask': ui.resetAsk=true;update();break;
    case 'reset-no': ui.resetAsk=false;update();break;
    case 'reset-si': borrarTodo(el);break;
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target;
  var sb=f.querySelector('button[type=submit]');
  if(f.id==='f-perfil')guardarPerfil(sb);
  if(f.id==='f-login-ac')loginAcomp(sb);
  if(f.id==='f-login-fam')loginFam(sb);
  if(f.id==='f-setup-fam')setupFam(sb);
  if(f.id==='f-pair')pairAdulto(sb);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.getAttribute&&t.getAttribute('data-draft'))drafts[t.getAttribute('data-draft')]=t.value;
  if(t.id==='wz-detalle')wz.detalle=t.value;
  if(t.id==='wz-pedido')wz.pedido=t.value;
  if(t.getAttribute&&t.getAttribute('data-pin')){var c=t.value.replace(/\D/g,'').slice(0,6);if(c!==t.value)t.value=c;}
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t)return;
  if(t.id==='wz-fecha-in'&&t.value){wz.fecha=t.value;ui.wizErr='';renderWiz();}
  if(t.id==='wz-hora-in'&&t.value){wz.hora=t.value;ui.wizErr='';renderWiz();}
  if(t.id==='barrio')ui.barrioSel=t.value;
});
['click','keydown','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});
window.addEventListener('hashchange',function(){ui.confirmAyuda=false;ui.msgAdulto='';ui.cancelId=null;render();});

/* ===== Base de datos compartida ===== */
function avisoNuevo(kind,snap){
  if(route.role!=='familiar'||typeof snap.docChanges!=='function')return;
  snap.docChanges().forEach(function(ch){
    if(ch.type!=='added')return;
    var d=ch.doc.data();if(!d||!d.creada||Date.now()-new Date(d.creada).getTime()>120000)return;
    var n=nombreAdulto()||'Tu familiar';
    if(kind==='checkins')toast(n+' avisó que está bien.');
    else if(d.estado==='abierta')toast(n+' pidió ayuda.','bad');
  });
}
function onErr(k){return function(e){console.error('db',k,e);state.conn='offline';update();};}
function stopSubs(){
  unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];
  state.loaded={adulto:false,visitas:false,ayuda:false,checkins:false,acomp:false,audit:false};
  state.adulto={nombre:'',barrio:''};state.visitas=[];state.ayudas=[];state.checkins=[];state.acomps=[];state.audit=[];
  first={ayuda:true,checkins:true};
}
function startSubs(){
  stopSubs();
  var db=state.db,r=route.role,h=hid();
  if(!db||!r||gateName())return;
  function ok(k){state.loaded[k]=true;state.conn='live';}
  function sub(ref,fn,k){unsubs.push(ref.onSnapshot(fn,onErr(k)));}
  function perfil(){sub(db.doc('perfil/'+h),function(sn){state.adulto=sn.exists?Object.assign({nombre:'',barrio:''},sn.data()):{nombre:'',barrio:''};ok('adulto');update();},'adulto');}
  function visitas(q){sub(q,function(sn){state.visitas=mapDocs(sn);ok('visitas');update();},'visitas');}
  function checkins(){sub(db.collection('checkins').where('hid','==',h),function(sn){state.checkins=mapDocs(sn).sort(byCreada).slice(0,30);ok('checkins');if(first.checkins)first.checkins=false;else avisoNuevo('checkins',sn);update();},'checkins');}
  /* Mínimo privilegio: cada rol solo descarga lo que necesita */
  if(r==='familiar'){
    perfil();visitas(db.collection('visitas').where('hid','==',h));checkins();
    sub(db.collection('acompanantes'),function(sn){state.acomps=mapDocs(sn);ok('acomp');update();},'acomp');
    sub(db.collection('ayuda').where('hid','==',h),function(sn){state.ayudas=mapDocs(sn).sort(byCreada).slice(0,30);ok('ayuda');if(first.ayuda)first.ayuda=false;else avisoNuevo('ayuda',sn);update();},'ayuda');
    sub(db.collection('auditoria').where('hid','==',h),function(sn){state.audit=mapDocs(sn).sort(byCreada).slice(0,6);ok('audit');update();},'audit');
  } else if(r==='adulto'){
    perfil();visitas(db.collection('visitas').where('hid','==',h));checkins();
  } else if(r==='acompanante'){
    var id=session.id;
    sub(db.doc('acompanantes/'+id),function(sn){state.acomps=sn.exists?[Object.assign({},sn.data(),{id:sn.id})]:[];ok('acomp');update();},'acomp');
    visitas(db.collection('visitas').where('acompId','==',id));
  }
}
function init(){
  wzDefaults();
  render();
  var p;
  try{p=(window.claude&&window.claude.use)?window.claude.use('db'):Promise.resolve(null);}catch(e){p=Promise.resolve(null);}
  Promise.race([Promise.resolve(p),new Promise(function(r){setTimeout(function(){r(null);},10000);})]).then(function(db){
    if(!db){state.conn='offline';update();return;}
    state.db=db;state.conn='live';subKey=null;render();
  }).catch(function(e){console.error(e);state.conn='offline';update();});
  /* Refresca cuentas regresivas y "hace X min" sin tocar formularios */
  setInterval(function(){
    if(session){if(session.exp<=Date.now()){logout('Cerraste sesión por inactividad.');return;}saveSession();}
    if((route.role+'/'+(route.tab||''))!=='familiar/agendar')update();
  },15000);
}
init();
})();
</script>
